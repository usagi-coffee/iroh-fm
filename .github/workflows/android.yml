name: Android
run-name: Android (${{ github.event.workflow_run.head_sha }})

on:
  workflow_run:
    workflows: [Web]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ${{ github.event.workflow_run.event == 'push' && (startsWith(github.event.workflow_run.head_commit.message, 'android:') || startsWith(github.event.workflow_run.head_commit.message, 'ci:')) && format('android-{0}', github.event.workflow_run.head_branch) || format('android-skip-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  NDK_VERSION: "28.2.13676358"
  EXPECTED_RELEASE_SHA256: "B4:39:05:72:C0:38:D1:68:0B:74:48:BC:F7:03:9B:07:00:D4:A8:8D:E2:B4:3C:17:8E:EC:50:02:33:D2:24:41"
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  build:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.conclusion == 'success' && (startsWith(github.event.workflow_run.head_commit.message, 'android:') || startsWith(github.event.workflow_run.head_commit.message, 'ci:'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;$NDK_VERSION"

      - name: Export Android NDK path
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build Rust JNI libraries
        run: |
          ./android/build-rust.sh
          test -f android/app/src/main/jniLibs/arm64-v8a/libiroh_fm_android_native.so
          test -f android/app/src/main/jniLibs/armeabi-v7a/libiroh_fm_android_native.so
          test -f android/app/src/main/jniLibs/x86_64/libiroh_fm_android_native.so

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Require release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "Android release builds require all three signing secrets." >&2
            exit 1
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          keystore_path="$RUNNER_TEMP/iroh-fm-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Set release metadata
        run: |
          short_sha="${RELEASE_SHA::7}"
          version_code="$(date -u +%s)"
          echo "IROH_FM_VERSION_NAME=$short_sha" >> "$GITHUB_ENV"
          echo "IROH_FM_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "ANDROID_ARTIFACT_NAME=iroh-fm-android-$short_sha" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          gradle -p android --no-daemon \
            -PirohFmVersionName="$IROH_FM_VERSION_NAME" \
            -PirohFmVersionCode="$IROH_FM_VERSION_CODE" \
            -PirohFmBuildCommit="$RELEASE_SHA" \
            :app:assembleRelease

      - name: Verify release signature
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$apksigner_path" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          fingerprint="$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p')"
          if [ "$fingerprint" != "$EXPECTED_RELEASE_SHA256" ]; then
            echo "Signing certificate does not match the fingerprint published in assetlinks.json." >&2
            exit 1
          fi
          echo "### Android release certificate" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$fingerprint\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ANDROID_ARTIFACT_NAME }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Require release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "RELEASE_TOKEN must be a fine-grained token with Contents: read and write access." >&2
            exit 1
          fi

      - name: Download signed APK
        uses: actions/download-artifact@v8
        with:
          pattern: iroh-fm-android-*
          path: release
          merge-multiple: true

      - name: Name release APK
        run: |
          short_sha="${RELEASE_SHA::7}"
          release_date="$(date -u +%Y%m%d)"
          release_apk="release/iroh-fm-android-$short_sha.apk"
          mv release/app-release.apk "$release_apk"
          echo "RELEASE_APK=$release_apk" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=android-$RELEASE_SHA" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=Android $release_date ($short_sha)" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE"
            gh release upload "$RELEASE_TAG" "$RELEASE_APK" --clobber
          else
            gh release create "$RELEASE_TAG" "$RELEASE_APK" \
              --target "$RELEASE_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "Android build of $RELEASE_SHA."
          fi
