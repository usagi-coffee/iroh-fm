name: Desktop
run-name: Desktop (${{ github.event.workflow_run.head_sha }})

on:
  workflow_run:
    workflows: [Web]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.event.workflow_run.event == 'push' && (startsWith(github.event.workflow_run.head_commit.message, 'desktop:') || startsWith(github.event.workflow_run.head_commit.message, 'ci:')) && format('desktop-{0}', github.event.workflow_run.head_branch) || format('desktop-skip-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  build:
    name: ${{ matrix.cache_key }}
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.conclusion == 'success' && (startsWith(github.event.workflow_run.head_commit.message, 'desktop:') || startsWith(github.event.workflow_run.head_commit.message, 'ci:'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            cache_key: linux-x64
            rust_target: ""
            tauri_args: --config src-tauri/tauri.ci.conf.json
          - platform: ubuntu-24.04-arm
            cache_key: linux-arm64
            rust_target: ""
            tauri_args: --bundles deb,rpm --config src-tauri/tauri.ci.conf.json
          - platform: windows-latest
            cache_key: windows-x64
            rust_target: ""
            tauri_args: --bundles nsis --config src-tauri/tauri.ci.conf.json
          - platform: macos-latest
            cache_key: macos-arm64
            rust_target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin --bundles dmg --config src-tauri/tauri.ci.conf.json
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Download desktop web assets
        uses: actions/download-artifact@v8
        with:
          name: desktop-web-${{ env.RELEASE_SHA }}
          path: packages/web/build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Install desktop system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            rpm \
            xdg-utils

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
          key: ${{ matrix.cache_key }}

      - name: Set desktop asset name
        id: asset
        shell: bash
        run: echo "prefix=iroh-fm_${RELEASE_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/web
          releaseAssetNamePattern: ${{ steps.asset.outputs.prefix }}_[platform]_[arch][ext]
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: desktop-[platform]-[arch]-[bundle]
          args: ${{ matrix.tauri_args }}

  publish:
    name: publish-release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Require release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "RELEASE_TOKEN must be a fine-grained token with Contents: read and write access." >&2
            exit 1
          fi

      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Download all desktop bundles
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      - name: Set release metadata
        run: |
          epoch_commit="$(git log --format=%H --grep='^desktop:' -1 "$RELEASE_SHA")"
          epoch="$(git rev-list --count "$epoch_commit")"
          echo "RELEASE_TAG=desktop-$RELEASE_SHA" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=Desktop v$epoch" >> "$GITHUB_ENV"

      - name: Publish complete Desktop release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' release_assets < <(find release -type f -print0)
          if [ "${#release_assets[@]}" -eq 0 ]; then
            echo "No desktop bundles were downloaded." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE"
            gh release upload "$RELEASE_TAG" "${release_assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${release_assets[@]}" \
              --target "$RELEASE_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "Desktop build of $RELEASE_SHA."
          fi
