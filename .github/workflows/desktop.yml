name: Desktop
run-name: Desktop (${{ github.event.workflow_run.head_sha }})

on:
  workflow_run:
    workflows: [Web]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: ${{ github.event.workflow_run.event == 'push' && (startsWith(github.event.workflow_run.head_commit.message, 'desktop:') || startsWith(github.event.workflow_run.head_commit.message, 'ci:')) && format('desktop-{0}', github.event.workflow_run.head_branch) || format('desktop-skip-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  release:
    name: ${{ matrix.cache_key }}
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.conclusion == 'success' && (startsWith(github.event.workflow_run.head_commit.message, 'desktop:') || startsWith(github.event.workflow_run.head_commit.message, 'ci:'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            cache_key: linux-x64
            rust_target: ""
            tauri_args: --config src-tauri/tauri.ci.conf.json
          - platform: windows-latest
            cache_key: windows-x64
            rust_target: ""
            tauri_args: --bundles nsis --config src-tauri/tauri.ci.conf.json
          - platform: macos-latest
            cache_key: macos-arm64
            rust_target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin --config src-tauri/tauri.ci.conf.json
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Download desktop web assets
        uses: actions/download-artifact@v4
        with:
          name: desktop-web-${{ env.RELEASE_SHA }}
          path: packages/web/build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Install desktop system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            rpm \
            xdg-utils

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
          key: ${{ matrix.cache_key }}

      - name: Set release metadata
        id: release
        shell: bash
        run: |
          short_sha="${RELEASE_SHA::7}"
          echo "tag=desktop-$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "title=Desktop ($short_sha)" >> "$GITHUB_OUTPUT"

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/web
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: ${{ steps.release.outputs.title }}
          releaseBody: Desktop build of ${{ env.RELEASE_SHA }}.
          releaseCommitish: ${{ env.RELEASE_SHA }}
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: iroh-fm_[version]_[platform]_[arch][ext]
          args: ${{ matrix.tauri_args }}
