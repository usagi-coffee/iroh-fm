name: Web

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore WASM build tools
        id: wasm-tools-cache
        uses: actions/cache@v4
        with:
          path: .ci-tools/bin
          key: web-wasm-tools-v1-${{ runner.os }}-${{ runner.arch }}-bindgen-0.2.125

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: web

      - name: Install WASM build tools
        if: steps.wasm-tools-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci-tools/bin
          cargo install wasm-bindgen-cli --version 0.2.125 --locked
          sudo apt-get update
          sudo apt-get install --yes binaryen
          cp "$(command -v wasm-bindgen)" .ci-tools/bin/wasm-bindgen
          cp "$(command -v wasm-opt)" .ci-tools/bin/wasm-opt

      - name: Add WASM build tools to PATH
        run: echo "$GITHUB_WORKSPACE/.ci-tools/bin" >> "$GITHUB_PATH"

      - name: Set Pages base path
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          owner_name="${GITHUB_REPOSITORY_OWNER,,}"
          if [ "$repo_name" = "$owner_name.github.io" ]; then
            echo "PAGES_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "PAGES_BASE_PATH=/$repo_name" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build WASM
        run: bun run --cwd packages/web build:wasm

      - name: Check
        run: bun run --cwd packages/web check:prepared

      - name: Build desktop web assets
        if: github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'desktop:') || startsWith(github.event.head_commit.message, 'ci:'))
        run: BASE_PATH= bun run --cwd packages/web build:prepared

      - name: Upload desktop web assets
        if: github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'desktop:') || startsWith(github.event.head_commit.message, 'ci:'))
        uses: actions/upload-artifact@v4
        with:
          name: desktop-web-${{ github.sha }}
          path: packages/web/build
          if-no-files-found: error
          retention-days: 2

      - name: Build Pages
        run: BASE_PATH="$PAGES_BASE_PATH" bun run --cwd packages/web build:prepared

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
