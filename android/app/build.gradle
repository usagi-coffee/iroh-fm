plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def buildCommit = (
    project.findProperty('irohFmBuildCommit') ?:
    System.getenv('RELEASE_SHA') ?:
    'development'
).toString()
def gitOutput = { List<String> arguments ->
    try {
        return providers.exec {
            workingDir rootProject.projectDir.parentFile
            commandLine(['git'] + arguments)
        }.standardOutput.asText.get().trim()
    } catch (ignored) {
        return null
    }
}
def epochCommit = (
    project.findProperty('irohFmEpochCommit') ?:
    System.getenv('ANDROID_EPOCH_COMMIT') ?:
    gitOutput(['log', '--format=%H', '--grep=^android:', '-1']) ?:
    buildCommit
).toString()
def epoch = (
    project.findProperty('irohFmEpoch') ?:
    System.getenv('ANDROID_EPOCH') ?:
    gitOutput(['rev-list', '--count', epochCommit]) ?:
    '0'
).toString().toInteger()
def hasReleaseSigning = [
    releaseKeystorePath,
    releaseKeystorePassword,
    releaseKeyAlias,
].every { value -> value != null && !value.isBlank() }

android {
    namespace 'fm.iroh.android'
    compileSdk 36

    defaultConfig {
        applicationId 'fm.iroh.android'
        minSdk 26
        targetSdk 35
        versionCode = (project.findProperty('irohFmVersionCode') ?: '1').toString().toInteger()
        versionName = (project.findProperty('irohFmVersionName') ?: 'local').toString()

        def webOrigin = project.findProperty('irohFmOrigin') ?: 'https://usagi-coffee.github.io'
        def launchUrl = project.findProperty('irohFmLaunchUrl') ?: "${webOrigin}/iroh-fm/"
        buildConfigField 'String', 'LAUNCH_URL', "\"${launchUrl}\""
        buildConfigField 'String', 'WEB_ORIGIN', "\"${webOrigin}\""
        buildConfigField 'String', 'BUILD_COMMIT', "\"${buildCommit}\""
        buildConfigField 'int', 'EPOCH', epoch.toString()
        buildConfigField 'String', 'EPOCH_COMMIT', "\"${epochCommit}\""
        resValue 'string', 'app_name', 'iroh.fm'
        resValue 'string', 'launch_url', launchUrl
        resValue 'string', 'web_origin', webOrigin
        resValue 'string', 'asset_statements', "[{\\\"relation\\\":[\\\"delegate_permission/common.handle_all_urls\\\",\\\"delegate_permission/common.use_as_origin\\\"],\\\"target\\\":{\\\"namespace\\\":\\\"web\\\",\\\"site\\\":\\\"${webOrigin}\\\"}}]"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeystorePassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.media3:media3-datasource:1.6.1'
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-session:1.6.1'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
